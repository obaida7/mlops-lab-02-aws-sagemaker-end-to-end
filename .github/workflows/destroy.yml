name: Destroy Infrastructure & Teardown Compute

on:
  workflow_dispatch:
    inputs:
      destroy_scope:
        description: 'Teardown Scope'
        required: true
        default: 'compute_and_endpoints'
        type: choice
        options:
          - 'compute_and_endpoints'
          - 'full_infrastructure'

permissions:
  contents: read

jobs:
  teardown:
    name: Destroy MLOps Resources
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install boto3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-2

    - name: Teardown Compute and Endpoints ($0.00 Idle Cost)
      run: |
        if [ "${{ github.event.inputs.destroy_scope }}" = "full_infrastructure" ]; then
          python scripts/destroy_all.py --clean-registry
        else
          python scripts/destroy_all.py
        fi

    - name: Setup Terraform (if full_infrastructure selected)
      if: ${{ github.event.inputs.destroy_scope == 'full_infrastructure' }}
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.5.7

    - name: Terraform Destroy
      if: ${{ github.event.inputs.destroy_scope == 'full_infrastructure' }}
      working-directory: ./terraform
      run: |
        terraform init
        terraform destroy -auto-approve
